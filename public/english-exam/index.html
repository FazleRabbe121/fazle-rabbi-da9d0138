<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Level Exam</title>
<link rel="stylesheet" href="css/style.css"></head>
<body>
<header><b id="brand"></b><span id="tm" class="hide"></span></header>
<div id="bar" class="hide"><i id="pb"></i></div>
<main>
<section id="s-start" class="card">
 <h1>English Level Exam</h1>
 <p class="mu">CEFR level test (A1 to C2) with Grammar, Vocabulary, Reading, Listening, Speaking and Writing.</p>
 <ul><li>30 multiple-choice questions, including 4 listening questions</li><li>3 speaking tasks (microphone required)</li><li>1 writing task</li><li>Do not use a dictionary, translator or any help.</li></ul>
 <label class="fld">Full name<input id="nm" autocomplete="name"></label>
 <label class="fld">Email (optional)<input id="em" type="email" autocomplete="email"></label>
 <button id="go">Start exam</button>
</section>
<section id="s-q" class="card hide"></section>
<section id="s-sp" class="card hide"></section>
<section id="s-wr" class="card hide"></section>
<section id="s-res" class="hide"></section>
</main>
<script src="js/config.js"></script><script src="js/questions.js"></script><script src="js/app.js"></script>
</body></html>
